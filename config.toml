# Fussball-Kalender: Konfiguration
#
# Quellenauswahl pro Kalender:
#   Standard: Quellen der Reihe nach; die erste mit >= min_matches Spielen gewinnt,
#             sonst die ergiebigste. Ausfaelle (404, Netzfehler) werden uebersprungen.
#   merge = true: alle Quellen zusammenfuehren, Dubletten (Datum + Teams) entfernen.
#             Quellen mit fallback = true nur nutzen, wenn davor nichts geladen wurde
#             (gehoeren deshalb ans Ende der Liste).
#   required = true: liefert keine Quelle Daten, bricht der Job ab (alter Stand bleibt online).
#
# Quellenarten:
#   uefa               match.uefa.com (inoffizielle UEFA-Frontend-API, ohne Key)
#                      only_phases / exclude_phases: Teilstrings fuer Phase/Runde
#   openligadb         api.openligadb.de, ODbL, ohne Key, Community-gepflegt
#   football_data      api.football-data.org, Key als Env FOOTBALL_DATA_TOKEN
#   openfootball_json  / openfootball_txt   GitHub, Public Domain, oft ohne Uhrzeit
#
# Reihenfolge nach Quellen-Test vom 2026-10-26 (probe_sources.py):
#   UEFA-API: CL 234, EL 224, Nations League 156 Spiele, 100 % mit Uhrzeit
#   OpenLigaDB: bl1 306 und la1 380 (99-100 % Uhrzeit), ucl 144, uel2026 144, nla 48, DFBN 6

[output]
past_days = 7          # so viele Tage Vergangenheit bleiben im Feed
base_url = ""          # z.B. https://DEINNAME.github.io/fussball-kalender (oder Env BASE_URL)

# ---------------------------------------------------------------- Top-Spiele
[top]
title = "Fussball Top-Spiele"
min_score = 2          # 3 = nur Kracher, 2 = auch Kern-Verein gegen starken Gegner, 1 = jedes Spiel eines Kern-Vereins

# Alias-Regeln: Gross/Klein und Akzente egal. Normaler Alias = ganzes Wort im Namen.
# "=Name" = exakter Name (UEFA nutzt Kurznamen wie "Paris" oder "Barcelona";
# als normaler Alias wuerde "Barcelona" auch "Espanyol Barcelona" treffen).
core = [
  ["Paris Saint-Germain", "PSG", "Paris SG", "=Paris"],
  ["FC Barcelona", "Barca", "=Barcelona"],
  ["Real Madrid"],
  ["Bayern"],
]

# Starke Gegner: Kern-Verein gegen diese Klubs zaehlt als Top-Spiel (Stufe 2)
strong = [
  ["Arsenal"],
  ["Manchester City", "Man City"],
  ["Liverpool"],
  ["Internazionale", "Inter Milan", "Inter Mailand", "=Inter"],
  ["Atletico Madrid", "Atletico de Madrid", "Atleti"],
  ["Borussia Dortmund", "Dortmund", "BVB"],
  ["Leverkusen"],
  ["Juventus"],
  ["AC Milan", "AC Mailand", "=Milan"],
  ["Napoli", "SSC Neapel"],
  ["Chelsea"],
  ["Manchester United", "Man United", "Man Utd"],
]

# Nationalteams (Englisch fuer UEFA/openfootball, Deutsch fuer OpenLigaDB):
# zwei davon gegeneinander = Stufe 2, WM/EM Halbfinale und Finale = Stufe 3
national_strong = [
  "France", "Frankreich", "Spain", "Spanien", "Germany", "Deutschland", "England",
  "Argentina", "Argentinien", "Brazil", "Brasilien", "Portugal", "Netherlands", "Niederlande",
  "Italy", "Italien",
]

